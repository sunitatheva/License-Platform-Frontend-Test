<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Executive Insight</title>

<link rel="stylesheet" href="styles.css">
https://cdn.jsdelivr.net/npm/chart.jsscript>

</head>

<body>

<div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="brand">LICENSE</div>

        <nav>
            <a class="active">Executive Insight</a>
            <a>License Overview</a>
            <a>Technology Layer</a>
            <a>Compliance</a>
            <a>Settings</a>
        </nav>
    </aside>

    <!-- Main -->
    <main class="content">

        <!-- Header -->
        <div class="header">
            <div>
                <h1>Executive Insight</h1>
                <p>Real-time license intelligence</p>
            </div>
            <input type="date" id="datePicker"/>
        </div>

        <!-- KPI -->
        <div id="kpiContainer" class="kpis"></div>

        <!-- Charts -->
        <div class="charts">
            <div class="card">
                <h3>Department Cost</h3>
                <canvas id="barChart"></canvas>
            </div>

            <div class="card">
                <h3>Technology Mix</h3>
                <canvas id="pieChart"></canvas>
            </div>
        </div>

        <!-- Table -->
        <div class="card">
            <h3>License Gap</h3>
            <table id="gapTable"></table>
        </div>

    </main>
</div>

<script src="app.js"></script>
</body>
</html>
